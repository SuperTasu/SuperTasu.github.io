<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バイトシフト管理（折りたたみ同僚シフト・名前編集対応）</title>
<style>
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    color: #333;
    background-color: #f0f2f5;
    padding: 16px;
    margin: 0;
  }

  .container {
    max-width: 1000px;
    margin: 0 auto;
  }

  .shift-card {
    background: #fff;
    padding: 16px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }

  .header-area {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .title {
    font-size: 16px;
    font-weight: bold;
    color: #333;
    margin: 0;
  }

  .save-status {
    font-size: 12px;
    color: #27ae60;
    font-weight: bold;
    transition: opacity 0.3s;
  }

  .table-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: center;
    font-size: 13px;
    white-space: nowrap;
  }

  th {
    background-color: #5088c4;
    color: #ffffff;
    padding: 10px 8px;
    font-weight: normal;
    border: 1px solid #3e73ad;
  }

  td {
    padding: 6px 6px;
    border: 1px solid #dcdcdc;
    vertical-align: middle;
  }

  tr:nth-child(even) { background-color: #fafbfc; }
  tr.is-off { background-color: #f9f9f9; color: #999; }
  tr.is-open { background-color: #eaf3fc !important; }

  /* 曜日ごとの色 */
  .sat { color: #1a73e8; font-weight: bold; }
  .sun { color: #e74c3c; font-weight: bold; }

  /* 店舗名アコーディオントリガーボタン */
  .store-toggle-btn {
    color: #1a73e8;
    cursor: pointer;
    text-decoration: underline;
    background: none;
    border: none;
    font-size: 13px;
    padding: 3px 6px;
    font-family: inherit;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .store-toggle-btn:hover {
    color: #0b57d0;
    background-color: #e8f0fe;
    border-radius: 4px;
  }

  /* セレクトボックス */
  select.time-select {
    font-size: 12px;
    padding: 3px 2px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }

  /* 1時間ごとのポジション枠（自分用） */
  .hourly-schedule {
    display: flex;
    gap: 4px;
    justify-content: flex-start;
    align-items: center;
  }

  .hour-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #eef2f5;
    border-radius: 4px;
    padding: 3px 4px;
    min-width: 46px;
  }

  .hour-label {
    font-size: 10px;
    color: #555;
    margin-bottom: 2px;
    font-weight: bold;
  }

  select.pos-select {
    font-size: 11px;
    font-weight: bold;
    color: #fff;
    border: none;
    border-radius: 3px;
    padding: 2px 4px;
    outline: none;
    text-align: center;
    cursor: pointer;
  }

  /* ポジション別カラー */
  .bg-C    { background-color: #e67e22 !important; }
  .bg-Ft   { background-color: #27ae60 !important; }
  .bg-D    { background-color: #8e44ad !important; }
  .bg-K    { background-color: #d35400 !important; }
  .bg-REST { background-color: #7f8c8d !important; }

  /* =====================================
     折りたたみ（同僚メンバー）アコーディオン
  ===================================== */
  .coworker-drawer {
    display: none;
    background-color: #f6f9fc;
  }
  .coworker-drawer.show {
    display: table-row;
  }

  .drawer-inner {
    padding: 12px 16px;
    text-align: left;
    border: 1px solid #c9def5;
    background: #f8fbfe;
    border-radius: 6px;
    margin: 4px;
  }

  .drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: bold;
    color: #1a73e8;
  }

  .coworker-list-table {
    width: 100%;
    max-width: 600px;
    background: #fff;
    border-collapse: collapse;
    border: 1px solid #ddd;
    font-size: 12px;
  }

  .coworker-list-table th {
    background-color: #e3effa;
    color: #333;
    font-weight: bold;
    padding: 6px;
    border: 1px solid #d0e0f0;
  }

  .coworker-list-table td {
    padding: 5px 8px;
    border: 1px solid #e5e5e5;
  }

  /* 名前入力フィールド */
  .name-input {
    width: 90%;
    font-size: 12px;
    padding: 4px 6px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-family: inherit;
  }
  .name-input:focus {
    border-color: #1a73e8;
    outline: none;
    background: #fff;
  }

  .btn-sm {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
  }
  .btn-add { background: #27ae60; color: #fff; }
  .btn-add:hover { background: #219150; }
  .btn-del { background: #e74c3c; color: #fff; }
  .btn-del:hover { background: #c0392b; }

  .note {
    margin-top: 10px;
    font-size: 12px;
    color: #666;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="container">
  <div class="shift-card">
    <div class="header-area">
      <h2 class="title">📋 2週間の勤務スケジュール</h2>
      <div id="save-status" class="save-status">✓ 自動保存済み</div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>勤務日</th>
            <th>勤務店舗 (クリックでメンバー展開)</th>
            <th>区分</th>
            <th>入店</th>
            <th>退店</th>
            <th style="min-width: 320px;">時間別ポジション</th>
          </tr>
        </thead>
        <tbody id="shift-tbody">
          <!-- JSで自動生成 -->
        </tbody>
      </table>
    </div>

    <div class="note">
      ※<strong>店舗名（イオンモール神戸南）</strong>を押すと、その日のすぐ下に出勤メンバーが展開します。<br>
      ※メンバーの名前・時間は自由に打ち換えることができ、自動保存されます。
    </div>
  </div>
</div>

<script>
// ==========================================
// 1. 定数・ポジション・時間設定
// ==========================================
const STORE_NAME = "イオンモール神戸南";
const POSITION_OPTIONS = [
  { value: "C",    label: "C",   class: "bg-C" },
  { value: "Ft",   label: "Ft",  class: "bg-Ft" },
  { value: "D",    label: "D",   class: "bg-D" },
  { value: "K",    label: "K",   class: "bg-K" },
  { value: "REST", label: "休",  class: "bg-REST" }
];

// 15分刻み (08:00 〜 23:45)
const TIME_OPTIONS = [];
for (let h = 8; h <= 23; h++) {
  for (let m = 0; m < 60; m += 15) {
    const hh = String(h).padStart(2, '0');
    const mm = String(m).padStart(2, '0');
    TIME_OPTIONS.push(`${hh}:${mm}`);
  }
}

// ==========================================
// 2. 今日から14日分（2週間）の日付生成
// ==========================================
const daysOfWeek = ["日", "月", "火", "水", "木", "金", "土"];
const twoWeeksList = [];
const today = new Date();

for (let i = 0; i < 14; i++) {
  const d = new Date(today);
  d.setDate(today.getDate() + i);

  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  const dateKey = `${yyyy}-${mm}-${dd}`;
  const dayStr = daysOfWeek[d.getDay()];

  let dayClass = "";
  if (d.getDay() === 6) dayClass = "sat";
  if (d.getDay() === 0) dayClass = "sun";

  twoWeeksList.push({
    key: dateKey,
    display: `${d.getMonth() + 1}/${d.getDate()} (${dayStr})`,
    dayClass: dayClass,
    dayIndex: d.getDay()
  });
}

// LocalStorageから取得（なければ初期データ生成）
let savedShiftMap = JSON.parse(localStorage.getItem("my_accordion_shift_data_v3")) || {};

twoWeeksList.forEach(item => {
  if (!savedShiftMap[item.key]) {
    const isWeekend = (item.dayIndex === 0 || item.dayIndex === 6);
    savedShiftMap[item.key] = {
      status: (item.dayIndex === 1 || item.dayIndex === 3) ? "休み" : "出勤",
      start: isWeekend ? "12:00" : "17:15",
      end: isWeekend ? "21:30" : "21:45",
      positions: {},
      // 同僚メンバー（初期サンプル）
      coworkers: isWeekend ? [
        { name: "山田 (店長)", start: "10:00", end: "19:00" },
        { name: "佐藤 (バイト)", start: "12:00", end: "21:30" },
        { name: "中村 (バイト)", start: "17:15", end: "22:00" }
      ] : [
        { name: "高橋 (社員)", start: "14:00", end: "22:00" },
        { name: "田中 (バイト)", start: "17:30", end: "21:45" },
        { name: "鈴木 (バイト)", start: "18:00", end: "22:00" }
      ]
    };
  }
});

// 開いているアコーディオンの管理
let openedKey = null;

// ==========================================
// 3. 自動保存処理
// ==========================================
function saveData() {
  localStorage.setItem("my_accordion_shift_data_v3", JSON.stringify(savedShiftMap));
  const statusEl = document.getElementById("save-status");
  statusEl.textContent = "✓ 自動保存済み";
  statusEl.style.opacity = "1";
}

// ==========================================
// 4. メインテーブル描画
// ==========================================
function renderTable() {
  const tbody = document.getElementById("shift-tbody");
  tbody.innerHTML = "";

  twoWeeksList.forEach(item => {
    const data = savedShiftMap[item.key];
    const isOpen = (openedKey === item.key);

    // --- 本体の行 ---
    const tr = document.createElement("tr");
    if (data.status === "休み") tr.classList.add("is-off");
    if (isOpen) tr.classList.add("is-open");

    // 日付
    const tdDate = document.createElement("td");
    tdDate.innerHTML = `<span class="${item.dayClass}">${item.display}</span>`;
    tr.appendChild(tdDate);

    // 店舗名（折りたたみトリガー）
    const tdStore = document.createElement("td");
    const storeBtn = document.createElement("button");
    storeBtn.className = "store-toggle-btn";
    storeBtn.innerHTML = `${STORE_NAME} <span>${isOpen ? '▲' : '▼'}</span>`;
    storeBtn.onclick = () => toggleCoworkerDrawer(item.key);
    tdStore.appendChild(storeBtn);
    tr.appendChild(tdStore);

    // 区分
    const tdKubun = document.createElement("td");
    tdKubun.innerHTML = `
      <select onchange="changeStatus('${item.key}', this.value)" style="font-size:11px;">
        <option value="出勤" ${data.status === '出勤' ? 'selected' : ''}>出勤</option>
        <option value="休み" ${data.status === '休み' ? 'selected' : ''}>休み</option>
      </select>
    `;
    tr.appendChild(tdKubun);

    if (data.status === "休み") {
      tr.innerHTML += `<td>-</td><td>-</td><td>-</td>`;
    } else {
      // 入店時間
      const tdStart = document.createElement("td");
      tdStart.appendChild(createTimeSelect(data.start, (val) => changeTime(item.key, 'start', val)));
      tr.appendChild(tdStart);

      // 退店時間
      const tdEnd = document.createElement("td");
      tdEnd.appendChild(createTimeSelect(data.end, (val) => changeTime(item.key, 'end', val)));
      tr.appendChild(tdEnd);

      // 時間別ポジション（自分用）
      const tdPos = document.createElement("td");
      const scheduleDiv = document.createElement("div");
      scheduleDiv.className = "hourly-schedule";

      const startHour = parseInt(data.start.split(":")[0], 10);
      const endHour = parseInt(data.end.split(":")[0], 10);
      const endMinute = parseInt(data.end.split(":")[1], 10);
      const maxHour = endMinute > 0 ? endHour : endHour - 1;

      for (let h = startHour; h <= maxHour; h++) {
        const hourStr = String(h);
        const currentPos = data.positions[hourStr] || "C";

        const slot = document.createElement("div");
        slot.className = "hour-slot";
        slot.innerHTML = `<span class="hour-label">${h}:00~</span>`;

        const posSelect = document.createElement("select");
        posSelect.className = `pos-select bg-${currentPos}`;
        
        POSITION_OPTIONS.forEach(opt => {
          const option = document.createElement("option");
          option.value = opt.value;
          option.textContent = opt.label;
          if (opt.value === currentPos) option.selected = true;
          posSelect.appendChild(option);
        });

        posSelect.onchange = (e) => {
          data.positions[hourStr] = e.target.value;
          posSelect.className = `pos-select bg-${e.target.value}`;
          saveData();
        };

        slot.appendChild(posSelect);
        scheduleDiv.appendChild(slot);
      }

      tdPos.appendChild(scheduleDiv);
      tr.appendChild(tdPos);
    }
    tbody.appendChild(tr);

    // --- 下に展開する折りたたみ行（同僚メンバー） ---
    const drawerTr = document.createElement("tr");
    drawerTr.className = `coworker-drawer ${isOpen ? 'show' : ''}`;
    
    const drawerTd = document.createElement("td");
    drawerTd.colSpan = 6;
    drawerTd.innerHTML = `
      <div class="drawer-inner">
        <div class="drawer-header">
          <span>👥 ${item.display} の出勤メンバー一覧</span>
          <button class="btn-sm btn-add" onclick="addCoworker('${item.key}')">＋ メンバー追加</button>
        </div>
        <table class="coworker-list-table">
          <thead>
            <tr>
              <th style="width: 45%;">スタッフ名前</th>
              <th style="width: 25%;">入店</th>
              <th style="width: 25%;">退店</th>
              <th style="width: 5%;"></th>
            </tr>
          </thead>
          <tbody id="coworker-tbody-${item.key}">
          </tbody>
        </table>
      </div>
    `;
    drawerTr.appendChild(drawerTd);
    tbody.appendChild(drawerTr);

    // 同僚リストの中身を描画
    if (isOpen) {
      renderCoworkerList(item.key);
    }
  });
}

// 同僚リストの中身を生成
function renderCoworkerList(key) {
  const container = document.getElementById(`coworker-tbody-${key}`);
  if (!container) return;
  container.innerHTML = "";

  const list = savedShiftMap[key].coworkers || [];

  if (list.length === 0) {
    container.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#888;">メンバーはいません</td></tr>`;
    return;
  }

  list.forEach((cw, idx) => {
    const tr = document.createElement("tr");

    // 名前入力欄（変更可能）
    const tdName = document.createElement("td");
    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.className = "name-input";
    nameInput.value = cw.name;
    nameInput.placeholder = "スタッフ名";
    nameInput.oninput = (e) => {
      cw.name = e.target.value;
      saveData();
    };
    tdName.appendChild(nameInput);
    tr.appendChild(tdName);

    // 入店時間
    const tdStart = document.createElement("td");
    tdStart.appendChild(createTimeSelect(cw.start, (val) => {
      cw.start = val;
      saveData();
    }));
    tr.appendChild(tdStart);

    // 退店時間
    const tdEnd = document.createElement("td");
    tdEnd.appendChild(createTimeSelect(cw.end, (val) => {
      cw.end = val;
      saveData();
    }));
    tr.appendChild(tdEnd);

    // 削除ボタン
    const tdDel = document.createElement("td");
    const delBtn = document.createElement("button");
    delBtn.className = "btn-sm btn-del";
    delBtn.textContent = "✕";
    delBtn.onclick = () => deleteCoworker(key, idx);
    tdDel.appendChild(delBtn);
    tr.appendChild(tdDel);

    container.appendChild(tr);
  });
}

// 15分刻みセレクト生成
function createTimeSelect(selectedVal, onChangeCallback) {
  const select = document.createElement("select");
  select.className = "time-select";
  TIME_OPTIONS.forEach(t => {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    if (t === selectedVal) opt.selected = true;
    select.appendChild(opt);
  });
  select.onchange = (e) => onChangeCallback(e.target.value);
  return select;
}

// ==========================================
// 5. イベント処理
// ==========================================
function toggleCoworkerDrawer(key) {
  openedKey = (openedKey === key) ? null : key;
  renderTable();
}

function addCoworker(key) {
  if (!savedShiftMap[key].coworkers) {
    savedShiftMap[key].coworkers = [];
  }
  savedShiftMap[key].coworkers.push({
    name: "新しいスタッフ",
    start: "17:00",
    end: "21:00"
  });
  saveData();
  renderCoworkerList(key);
}

function deleteCoworker(key, idx) {
  savedShiftMap[key].coworkers.splice(idx, 1);
  saveData();
  renderCoworkerList(key);
}

function changeStatus(key, newStatus) {
  savedShiftMap[key].status = newStatus;
  saveData();
  renderTable();
}

function changeTime(key, type, newVal) {
  savedShiftMap[key][type] = newVal;
  if (type === 'start' && savedShiftMap[key].start >= savedShiftMap[key].end) {
    const nextIdx = Math.min(TIME_OPTIONS.indexOf(newVal) + 4, TIME_OPTIONS.length - 1);
    savedShiftMap[key].end = TIME_OPTIONS[nextIdx];
  }
  saveData();
  renderTable();
}

// 初回レンダリング
renderTable();
</script>

</body>
</html>
